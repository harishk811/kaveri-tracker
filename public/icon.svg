<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Stylised runner in motion -->
  <g fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="300" cy="140" r="28" fill="url(#accent)" stroke="none"/>
    <!-- torso -->
    <path d="M 290 175 L 250 285"/>
    <!-- front arm -->
    <path d="M 270 210 L 330 195"/>
    <!-- back arm -->
    <path d="M 268 215 L 215 240"/>
    <!-- front leg -->
    <path d="M 250 285 L 305 360 L 360 350"/>
    <!-- back leg -->
    <path d="M 250 285 L 190 360 L 145 340"/>
  </g>
  <!-- canal trail line under runner -->
  <path d="M 60 410 Q 256 395 452 410" stroke="#5eead4" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 80 430 Q 256 418 432 430" stroke="#14b8a6" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- subtle "K" mark in corner -->
  <text x="256" y="478" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#5eead4" text-anchor="middle" opacity="0.75">KAVERI → 70.3</text>
</svg>
